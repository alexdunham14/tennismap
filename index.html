<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Map</title>
<meta name="description" content="Every professional tennis tournament of the season on a map, filterable by tour, level, surface, and date.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Tennis Map</h1>
<p>Every professional tournament of the season, from the Slams down to the ITF World Tennis Tour, plus Davis Cup and Billie Jean King Cup ties. Pick dates and see where the tennis is. City-level on purpose: that is how you plan a trip, and exact venues are often not announced anyway.</p>

<form id="f" onsubmit="return false">
  <label>from <input id="from" type="date"></label>
  <label>to <input id="to" type="date"></label>
  <label><input type="checkbox" name="tour" value="ATP" checked> men</label>
  <label><input type="checkbox" name="tour" value="WTA" checked> women</label>
  <label>level <select id="cat"><option value="">all</option></select></label>
  <label>surface <select id="surface"><option value="">all</option></select></label>
</form>

<div id="map"></div>

<p id="count"></p>
<div id="list"></div>

<hr>
<p id="meta"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
