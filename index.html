<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tennis Map</title>
<meta name="description" content="Every professional tennis tournament of the season on a map, filterable by tour, level, surface, and date.">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<h1>Tennis Map</h1>
<p>A map of pro tennis tournaments, filterable by date and competition tier.</p>

<form id="f" onsubmit="return false">
  <div class="row">
    <span class="rowlabel">dates</span>
    <div class="ctl">
      <label>from <input id="from" type="date"></label>
      <label>to <input id="to" type="date"></label>
      <span class="nudge"><button type="button" id="earlier" title="Shift the range back by its own length">&lsaquo; earlier</button> <button type="button" id="later" title="Shift the range forward by its own length">later &rsaquo;</button></span>
      <button type="button" id="clear-dates" class="clear" title="Show the whole season">clear</button>
      <span id="presets" class="presets"><a href="#" data-preset="week">this week</a> <a href="#" data-preset="eight">next 8 weeks</a> <a href="#" data-preset="season">whole season</a></span>
    </div>
  </div>
  <div class="row">
    <span class="rowlabel">tour</span>
    <div class="ctl">
      <label><input type="checkbox" name="tour" value="ATP" checked> <span class="dot men"></span>men</label>
      <label><input type="checkbox" name="tour" value="WTA" checked> <span class="dot women"></span>women</label>
    </div>
  </div>
  <div class="row">
    <span class="rowlabel">event</span>
    <div class="ctl">
      <label>level <select id="cat"><option value="">all</option></select></label>
      <label>surface <select id="surface"><option value="">all</option></select></label>
    </div>
  </div>
  <div class="row">
    <span class="rowlabel">search</span>
    <div class="ctl">
      <input id="q" type="search" placeholder="tournament, city, or country" aria-label="Search">
      <button type="button" id="reset" class="clear" title="Clear every filter">reset all</button>
    </div>
  </div>
</form>

<details>
  <summary>Details on the tiers of pro tennis</summary>
  <ol id="pyramid" class="pyramid"></ol>
</details>

<div id="map"></div>
<p id="legend" class="legend"></p>

<p id="count"></p>
<div id="list"></div>

<hr>
<p id="meta"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
