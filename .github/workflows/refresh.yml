name: Monthly refresh
on:
  schedule:
    - cron: "23 6 1 * *"   # first of the month, 06:23 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # google-chrome is preinstalled on ubuntu-latest; seed/itf.py needs it for
      # the ITF lookahead and exits 3 (refresh carries on) if it is missing.
      - name: Rebuild the calendar from Wikipedia and itftennis.com, geocode new cities
        run: ./refresh
      - name: Commit if changed
        run: |
          git config user.name "tennismap bot"
          git config user.email "actions@users.noreply.github.com"
          git add tournaments.json cities.json
          git diff --cached --quiet || git commit -m "Refresh calendar $(date -u +%F)"
          git push
